<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e6cf"/><stop offset=".45" stop-color="#e3c9a6"/><stop offset="1" stop-color="#c9a77f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8946b"/><stop offset=".5" stop-color="#f3e2c8"/><stop offset="1" stop-color="#a98559"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5d8f"/><stop offset=".5" stop-color="#8a2be2"/><stop offset="1" stop-color="#1d0a22"/>
    </linearGradient>
    <radialGradient id="lens" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#5a6a8a"/><stop offset=".35" stop-color="#1b2030"/><stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#3b1830" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- front -->
  <g filter="url(#shadow)" transform="rotate(-8 300 420)">
    <rect x="150" y="120" width="290" height="590" rx="54" fill="url(#rim)"/>
    <rect x="160" y="130" width="270" height="570" rx="46" fill="#0b0b10"/>
    <rect x="170" y="140" width="250" height="550" rx="38" fill="url(#screen)"/>
    <rect x="252" y="158" width="86" height="24" rx="12" fill="#0b0b10"/>
    <text x="295" y="300" fill="#fff" font-family="system-ui,sans-serif" font-size="64" font-weight="300" text-anchor="middle">9:41</text>
    <circle cx="230" cy="600" r="26" fill="#fff" fill-opacity=".22"/>
    <circle cx="360" cy="600" r="26" fill="#fff" fill-opacity=".22"/>
  </g>
  <!-- back -->
  <g filter="url(#shadow)" transform="rotate(7 520 400)">
    <rect x="370" y="90" width="290" height="590" rx="54" fill="url(#rim)"/>
    <rect x="378" y="98" width="274" height="574" rx="47" fill="url(#body)"/>
    <rect x="400" y="122" width="132" height="226" rx="40" fill="#d9bb93" stroke="#c6a57c" stroke-width="3"/>
    <circle cx="466" cy="182" r="44" fill="#a88a64"/>
    <circle cx="466" cy="182" r="34" fill="url(#lens)"/>
    <circle cx="455" cy="170" r="8" fill="#9fb3d9" fill-opacity=".6"/>
    <circle cx="466" cy="288" r="44" fill="#a88a64"/>
    <circle cx="466" cy="288" r="34" fill="url(#lens)"/>
    <circle cx="455" cy="276" r="8" fill="#9fb3d9" fill-opacity=".6"/>
    <circle cx="510" cy="235" r="9" fill="#fff6e0"/>
  </g>
</svg>
